name: Build Windows Portable EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：填写版本号（如 v0.1.0）则自动发布 GitHub Release"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            launcher -> target

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Rust unit tests
        run: |
          $manifest = (Resolve-Path "src-tauri\windows\app.manifest").Path
          $env:RUSTFLAGS = "-C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:$manifest"
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build single-file portable LifeWork.exe
        run: npm run app:portable

      - name: Generate SHA256 checksum
        run: |
          $exe = "release-portable\LifeWork.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected output missing: $exe"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LifeWork.exe" | Out-File -FilePath "release-portable\SHA256SUMS.txt" -Encoding utf8
          $sizeMb = [Math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "Built LifeWork.exe ($sizeMb MB), SHA256: $hash"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeWork-windows-portable
          path: |
            release-portable/LifeWork.exe
            release-portable/SHA256SUMS.txt
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-portable/LifeWork.exe
            release-portable/SHA256SUMS.txt
