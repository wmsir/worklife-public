[package]
name = "app"
version = "0.1.0"
description = "LifeWork 工作与生活管理桌面软件"
authors = ["meng"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "rt", "net"] }
walkdir = "2"
flate2 = "1"
crc32fast = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "multipart"] }
percent-encoding = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
